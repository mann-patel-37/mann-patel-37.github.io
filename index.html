<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel Line — Operations Console (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1512;
    --bg-soft: #121913;
    --surface: #182019;
    --surface-2: #1C2620;
    --border: #2A352E;
    --border-soft: #212B24;
    --text: #E7ECE5;
    --text-muted: #8FA095;
    --text-dim: #6B7C71;
    --amber: #D99A3E;
    --amber-dim: rgba(217,154,62,0.16);
    --teal: #4FA8A2;
    --teal-dim: rgba(79,168,162,0.16);
    --red: #C4573F;
    --red-dim: rgba(196,87,63,0.16);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans',sans-serif; font-size:14.5px;
    -webkit-font-smoothing:antialiased;
    height:100vh; overflow:hidden;
  }
  h1,h2,h3,h4{ font-family:'Space Grotesk',sans-serif; font-weight:600; margin:0; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  button{ font-family:inherit; cursor:pointer; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  /* Visible keyboard focus everywhere an interactive element got a custom look */
  a:focus-visible, button:focus-visible, input:focus-visible,
  .cam-row:focus-visible, .alert-item:focus-visible, .node:focus-visible{
    outline: 2px solid var(--teal); outline-offset: 2px; border-radius:2px;
  }
  .cam-row, .alert-item{ outline-offset:-2px; }

  .visually-hidden{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---------------- Shell ---------------- */
  .app{ display:flex; flex-direction:column; height:100vh; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    height:56px; padding:0 20px; border-bottom:1px solid var(--border-soft);
    flex-shrink:0; background:var(--bg-soft); gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-name{ font-size:15.5px; white-space:nowrap; }
  .status-strip{ display:flex; align-items:center; gap:22px; }
  .status-item{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-muted); white-space:nowrap; }
  .status-item .dot{ width:6px; height:6px; border-radius:50%; }
  .clock{ font-family:'IBM Plex Mono'; font-size:12.5px; color:var(--text-dim); min-width:150px; text-align:right; }

  .body{ flex:1; display:grid; grid-template-columns: 280px 1fr 340px; min-height:0; }
  @media (max-width: 1080px){ .body{ grid-template-columns: 240px 1fr 300px; } }

  /* Narrow / mobile: stack panels and allow the page to scroll instead of clipping content */
  @media (max-width: 860px){
    body{ height:auto; min-height:100vh; overflow-y:auto; overflow-x:hidden; }
    .app{ height:auto; min-height:100vh; }
    header{ height:auto; flex-wrap:wrap; padding:10px 16px; row-gap:8px; }
    .status-strip{ flex-wrap:wrap; gap:14px; width:100%; justify-content:space-between; }
    .clock{ text-align:left; min-width:0; }
    .body{ grid-template-columns:1fr; grid-auto-rows:auto; }
    .panel{ border-right:none; border-bottom:1px solid var(--border-soft); }
    .panel-body{ max-height:280px; }
    .map-wrap{ height:320px; flex:none; }
    #feedCanvas{ height:320px; }
    .detail-strip{ flex-wrap:wrap; row-gap:10px; }
    .d-actions{ margin-left:0; width:100%; }
  }

  /* ---------------- Panels ---------------- */
  .panel{ border-right:1px solid var(--border-soft); display:flex; flex-direction:column; min-height:0; }
  .panel:last-child{ border-right:none; }
  .panel-head{
    padding:16px 18px 12px; border-bottom:1px solid var(--border-soft); flex-shrink:0;
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  }
  .panel-head h2{ font-size:13px; text-transform:none; color:var(--text-muted); font-weight:500; letter-spacing:0.02em; }
  .panel-head .sub{ font-size:11px; color:var(--text-dim); }
  .panel-body{ flex:1; overflow-y:auto; padding: 10px 0; }

  /* ---------------- Camera list ---------------- */
  .search-box{
    margin:12px 18px 0; position:relative;
  }
  .search-box input{
    width:100%; background:var(--surface); border:1px solid var(--border);
    border-radius:3px; padding:8px 30px 8px 10px; color:var(--text); font-size:13px;
    font-family:inherit;
  }
  .search-box input:focus{ outline:none; border-color:var(--teal); }
  .search-clear{
    position:absolute; right:4px; top:50%; transform:translateY(-50%);
    width:24px; height:24px; display:none; align-items:center; justify-content:center;
    background:none; border:none; color:var(--text-dim); font-size:15px; border-radius:3px;
  }
  .search-clear:hover{ color:var(--text); background:var(--surface-2); }
  .search-clear.show{ display:flex; }

  .filter-row{ display:flex; gap:6px; margin:10px 18px 4px; flex-wrap:wrap; }
  .chip{
    font-size:11.5px; padding:4px 9px; border-radius:12px; border:1px solid var(--border);
    color:var(--text-dim); background:transparent; transition:all .12s ease;
    display:inline-flex; align-items:center; gap:5px;
  }
  .chip .count{ color:var(--text-dim); font-family:'IBM Plex Mono'; font-size:10.5px; }
  .chip.active{ border-color:var(--teal); color:var(--teal); background:var(--teal-dim); }
  .chip.active .count{ color:var(--teal); }

  .cam-row{
    display:flex; align-items:center; gap:10px; padding:9px 18px;
    cursor:pointer; border-left:2px solid transparent;
  }
  .cam-row:hover{ background:var(--surface); }
  .cam-row.selected{ background:var(--surface); border-left-color:var(--teal); }
  .cam-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .cam-dot.online{ background:var(--teal); }
  .cam-dot.offline{ background:var(--text-dim); }
  .cam-dot.alert{ background:var(--amber); box-shadow:0 0 0 3px var(--amber-dim); }
  .cam-info{ flex:1; min-width:0; }
  .cam-name{ font-size:13.5px; color:var(--text); }
  .cam-sector{ font-size:11px; color:var(--text-dim); }
  .cam-empty{ padding:20px 18px; color:var(--text-dim); font-size:13px; }
  .cam-empty button{ color:var(--teal); background:none; border:none; padding:0; font-size:13px; text-decoration:underline; }

  /* ---------------- Map ---------------- */
  .map-wrap{ flex:1; position:relative; background:var(--bg); min-height:0; }
  .map-wrap svg{ width:100%; height:100%; display:block; }
  .map-legend{
    position:absolute; bottom:16px; left:18px; display:flex; gap:16px;
    font-size:11.5px; color:var(--text-dim); flex-wrap:wrap;
  }
  .map-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .map-toolbar{
    position:absolute; top:16px; left:18px; display:flex; gap:8px; z-index:3;
  }
  .tbtn{
    background:var(--surface); border:1px solid var(--border); color:var(--text-muted);
    font-size:12px; padding:6px 12px; border-radius:3px;
  }
  .tbtn:hover{ border-color:var(--text-dim); color:var(--text); }
  .tbtn.active{ border-color:var(--teal); color:var(--teal); }

  #feedCanvas{ width:100%; height:100%; display:block; background:#0B100D; }
  #webcamVideo{ width:100%; height:100%; display:none; background:#0B100D; object-fit:cover; }

  .alert-thumb{
    width:100%; display:block; margin-top:8px; border-radius:3px;
    border:1px solid var(--border-soft); background:#000;
  }
  .evidence-img{
    width:100%; display:block; border-radius:4px; border:1px solid var(--border); background:#000;
  }

  @keyframes pulseRing{ 0%{ r:5; opacity:0.85; } 70%{ r:26; opacity:0; } 100%{ r:26; opacity:0; } }
  .node-pulse{ animation:pulseRing 2.4s ease-out infinite; }
  .node{ cursor:pointer; }
  .node-label{ font-family:'IBM Plex Mono'; font-size:9.5px; fill:var(--text-dim); pointer-events:none; }
  @media (prefers-reduced-motion: reduce){ .node-pulse{ animation:none; } }

  /* ---------------- Detail drawer (bottom of map) ---------------- */
  .detail-strip{
    border-top:1px solid var(--border-soft); background:var(--bg-soft);
    padding:14px 20px; display:flex; gap:28px; align-items:center; flex-shrink:0;
    min-height:76px;
  }
  .detail-strip .empty{ color:var(--text-dim); font-size:13px; }
  .d-field{ display:flex; flex-direction:column; gap:3px; }
  .d-field label{ font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; }
  .d-field .val{ font-size:13.5px; color:var(--text); }
  .d-field .val.mono{ font-size:12.5px; }
  .pill{ font-size:11px; padding:3px 9px; border-radius:10px; display:inline-block; }
  .pill.online{ background:var(--teal-dim); color:var(--teal); }
  .pill.offline{ background:rgba(107,124,113,0.18); color:var(--text-dim); }
  .pill.alert{ background:var(--amber-dim); color:var(--amber); }
  .d-actions{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .btn{
    border:1px solid var(--border); background:transparent; color:var(--text);
    padding:7px 14px; font-size:12.5px; border-radius:3px;
  }
  .btn:hover{ border-color:var(--text-dim); }
  .btn.primary{ background:var(--amber); border-color:var(--amber); color:#191309; font-weight:500; }
  .btn.primary:hover{ background:#e6ab52; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn.small{ padding:4px 9px; font-size:11px; }

  /* ---------------- Alert feed ---------------- */
  .feed-stats{ display:flex; gap:14px; padding:0 18px 10px; }
  .fstat{ flex:1; }
  .fstat b{ display:block; font-family:'Space Grotesk'; font-size:19px; }
  .fstat span{ font-size:10.5px; color:var(--text-dim); }

  .feed-legend{ display:flex; gap:12px; padding:0 18px 12px; font-size:11px; color:var(--text-dim); flex-wrap:wrap; }
  .feed-legend span{ display:inline-flex; align-items:center; gap:5px; }

  .alert-item{
    padding:12px 18px; border-bottom:1px solid var(--border-soft);
    cursor:pointer; transition:background .12s ease; position:relative;
  }
  .alert-item:hover{ background:var(--surface); }
  .alert-item.selected{ background:var(--surface-2); }
  .alert-item.ack{ opacity:0.5; }
  .alert-item.is-new{ animation:newAlertFlash 1.6s ease-out; }
  @keyframes newAlertFlash{ 0%{ background:var(--teal-dim); } 100%{ background:transparent; } }
  @media (prefers-reduced-motion: reduce){ .alert-item.is-new{ animation:none; } }
  .alert-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .sev-badge{ font-size:10px; padding:2px 7px; border-radius:3px; font-weight:500; letter-spacing:0.02em; }
  .sev-badge.high{ background:var(--red-dim); color:var(--red); }
  .sev-badge.med{ background:var(--amber-dim); color:var(--amber); }
  .sev-badge.low{ background:var(--teal-dim); color:var(--teal); }
  .alert-time{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-dim); }
  .alert-type{ font-size:13.5px; color:var(--text); margin-top:6px; }
  .alert-meta{ font-size:11.5px; color:var(--text-dim); margin-top:3px; }
  .alert-score{ display:flex; align-items:center; gap:6px; margin-top:8px; }
  .score-bar{ flex:1; height:3px; background:var(--border-soft); border-radius:2px; overflow:hidden; }
  .score-fill{ height:100%; border-radius:2px; }
  .score-num{ font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--text-dim); width:24px; text-align:right; }
  .alert-actions{ display:flex; justify-content:flex-end; margin-top:8px; }

  .empty-feed{ padding:24px 18px; color:var(--text-dim); font-size:13px; text-align:center; }

  /* ---------------- Case panel (modal-ish, slides from right within alert panel) ---------------- */
  .case-panel{
    position:absolute; inset:0; background:var(--bg); z-index:5;
    display:flex; flex-direction:column;
  }
  .case-head{
    padding:16px 18px; border-bottom:1px solid var(--border-soft);
    display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .back-btn{ background:none; border:none; color:var(--text-muted); font-size:18px; padding:2px 6px; line-height:1; border-radius:3px; }
  .back-btn:hover{ color:var(--text); background:var(--surface); }
  .case-title{ font-size:14px; }
  .case-body{ flex:1; overflow-y:auto; padding:16px 18px; }
  .case-section{ margin-bottom:22px; }
  .case-section h4{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim); margin-bottom:10px; font-weight:500; }
  .linked-event{ display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--border-soft); }
  .linked-event:first-child{ border-top:none; }
  .linked-dot{ width:6px; height:6px; border-radius:50%; background:var(--teal); margin-top:6px; flex-shrink:0; }
  .linked-body .lt{ font-size:13px; color:var(--text); }
  .linked-body .ls{ font-size:11px; color:var(--text-dim); margin-top:2px; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:10px 18px; border-radius:4px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2 L21 6.5 V12.5 C21 17.5 17.2 21.2 12 22.5 C6.8 21.2 3 17.5 3 12.5 V6.5 Z" stroke="#D99A3E" stroke-width="1.4"/>
        <circle cx="12" cy="12" r="2.4" fill="#4FA8A2"/>
      </svg>
      <span class="brand-name">Sentinel Line <span style="color:var(--text-dim); font-weight:400; font-size:12.5px;">— prototype console</span></span>
    </div>
    <div class="status-strip">
      <div class="status-item"><span class="dot" style="background:var(--teal);" aria-hidden="true"></span><span id="onlineCount">—</span> cameras online</div>
      <div class="status-item"><span class="dot" style="background:var(--amber);" aria-hidden="true"></span><span id="openAlertCount">—</span> open alerts</div>
      <div class="clock mono" id="clock">—</div>
    </div>
  </header>

  <div class="body">
    <!-- LEFT: camera list -->
    <div class="panel" id="cameraPanel">
      <div class="panel-head">
        <h2>Cameras</h2>
        <button class="tbtn" id="connectWebcamBtn" type="button">+ Connect Webcam</button>
      </div>
      <div class="search-box">
        <label class="visually-hidden" for="camSearch">Search cameras by name or sector</label>
        <input type="text" id="camSearch" placeholder="Search by name or sector…" autocomplete="off">
        <button class="search-clear" id="camSearchClear" type="button" aria-label="Clear search">&times;</button>
      </div>
      <div class="filter-row" id="camFilters" role="group" aria-label="Filter cameras by status">
        <button class="chip active" data-filter="all" aria-pressed="true">All <span class="count" id="countAll"></span></button>
        <button class="chip" data-filter="online" aria-pressed="false">Online <span class="count" id="countOnline"></span></button>
        <button class="chip" data-filter="alert" aria-pressed="false">Alert <span class="count" id="countAlert"></span></button>
        <button class="chip" data-filter="offline" aria-pressed="false">Offline <span class="count" id="countOffline"></span></button>
      </div>
      <div class="panel-body" id="cameraList" role="listbox" aria-label="Camera list"></div>
    </div>

    <!-- CENTER: map + detail strip -->
    <div class="panel" id="mapPanel" style="border-right:1px solid var(--border-soft); display:flex; flex-direction:column;">
      <div class="map-wrap">
        <div class="map-toolbar">
          <button class="tbtn" id="backToMapBtn" style="display:none;">&larr; Back to map</button>
          <button class="tbtn active" data-fence="1" id="fenceToggle" aria-pressed="true">Virtual fence: on</button>
        </div>
        <svg id="mapSvg" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Perimeter map with camera positions"></svg>
        <canvas id="feedCanvas" width="700" height="500" style="display:none;"></canvas>
        <video id="webcamVideo" autoplay playsinline muted style="display:none;"></video>
        <div class="map-legend">
          <span><span class="legend-dot" style="background:var(--teal);"></span>Online</span>
          <span><span class="legend-dot" style="background:var(--amber);"></span>Active alert</span>
          <span><span class="legend-dot" style="background:var(--text-dim);"></span>Offline</span>
        </div>
      </div>
      <div class="detail-strip" id="detailStrip">
        <div class="empty">Select a camera on the map or from the list to view its status.</div>
      </div>
    </div>

    <!-- RIGHT: alert feed / case view -->
    <div class="panel" id="feedPanel" style="position:relative;">
      <div class="panel-head"><h2>Live alert feed</h2></div>
      <div class="feed-stats">
        <div class="fstat"><b id="statHigh">0</b><span>High severity</span></div>
        <div class="fstat"><b id="statOpen">0</b><span>Unacknowledged</span></div>
        <div class="fstat"><b id="statAvg">0</b><span>Avg. threat score</span></div>
      </div>
      <div class="feed-legend">
        <span><span class="legend-dot" style="background:var(--red);"></span>High</span>
        <span><span class="legend-dot" style="background:var(--amber);"></span>Medium</span>
        <span><span class="legend-dot" style="background:var(--teal);"></span>Low</span>
      </div>
      <div class="panel-body" id="alertFeed"></div>

      <div class="case-panel" id="casePanel" style="display:none;"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  /* ============ DATA MODEL ============ */

  var SECTORS = ["Sector 02","Sector 04","Sector 05"];

  var cameras = [
    { id:"CAM-01", name:"CAM-01 — North Ridge",   sector:"Sector 04", x:120, y:360, status:"online" },
    { id:"CAM-02", name:"CAM-02 — Culvert Rd",     sector:"Sector 04", x:180, y:300, status:"online" },
    { id:"CAM-03", name:"CAM-03 — Watch Post 3",   sector:"Sector 04", x:230, y:230, status:"online" },
    { id:"CAM-04", name:"CAM-04 — Fence Line A",   sector:"Sector 04", x:290, y:170, status:"online" },
    { id:"CAM-05", name:"CAM-05 — Bridge Approach",sector:"Sector 02", x:370, y:120, status:"online" },
    { id:"CAM-06", name:"CAM-06 — Check Post 2",   sector:"Sector 02", x:450, y:95,  status:"online" },
    { id:"CAM-07", name:"CAM-07 — Border Road E",  sector:"Sector 02", x:530, y:120, status:"offline" },
    { id:"CAM-08", name:"CAM-08 — Ridge Overlook", sector:"Sector 05", x:560, y:220, status:"online" },
    { id:"CAM-09", name:"CAM-09 — South Trail",    sector:"Sector 05", x:520, y:300, status:"online" },
    { id:"CAM-10", name:"CAM-10 — Depot Gate",     sector:"Sector 05", x:460, y:370, status:"online" }
  ];

  var alertTemplates = [
    { type:"Virtual fence crossing", severity:"high", scoreRange:[78,96] },
    { type:"Loitering near fence line", severity:"med", scoreRange:[45,65] },
    { type:"Unrecognized face match", severity:"high", scoreRange:[70,92] },
    { type:"Night-time movement, unverified", severity:"med", scoreRange:[38,58] },
    { type:"Vehicle — plate low confidence", severity:"low", scoreRange:[15,34] },
    { type:"Group movement, off-hour", severity:"med", scoreRange:[50,68] },
    { type:"Possible camera tamper", severity:"high", scoreRange:[80,99] }
  ];

  var state = {
    selectedCameraId: null,
    selectedAlertId: null,
    camFilter: "all",
    camSearch: "",
    fenceOn: true,
    mapView: "map",   // "map" | "feed"
    alerts: [],       // {id, cameraId, type, severity, score, ts, acknowledged}
    nextAlertId: 1,
    lastNewAlertId: null
  };

  /* ---- Webcam (local browser device) state ----
     Kept separate from the `cameras` data objects: a MediaStream isn't
     serializable/display data, it's a live resource, so it lives here and
     the `cameras` array only ever holds the plain camera record. */
  var WEBCAM_CAM_ID = "CAM-WEB-001";
  var WEBCAM_CAM_NAME = "Laptop Webcam";
  var webcamState = {
    stream: null
  };

  /* ============ HELPERS ============ */

  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function fmtTime(d){ return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()); }
  function fmtClock(d){
    return d.toLocaleDateString(undefined,{month:"short",day:"2-digit"}) + "  " + fmtTime(d);
  }
  function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
  function pick(arr){ return arr[randInt(0,arr.length-1)]; }
  function byId(id){ return document.getElementById(id); }
  function scoreColor(score){ return score >= 70 ? "var(--red)" : score >= 45 ? "var(--amber)" : "var(--teal)"; }

  function cameraById(id){
    for (var i=0;i<cameras.length;i++){ if (cameras[i].id===id) return cameras[i]; }
    return null;
  }

  function showToast(msg){
    var t = byId("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  /* Enter/Space activates elements that behave like buttons but aren't <button> */
  function onActivateKey(e, fn){
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar"){
      e.preventDefault();
      fn();
    }
  }

  /* ============ ALERT GENERATION ============ */

  function generateAlert(){
    // The local webcam isn't part of the perimeter/fence system, so it's
    // excluded from the simulated alert generator.
    var onlineCams = cameras.filter(function(c){ return c.status !== "offline" && c.type !== "webcam"; });
    if (onlineCams.length === 0) return null;
    var cam = pick(onlineCams);
    var tmpl = pick(alertTemplates);
    var score = randInt(tmpl.scoreRange[0], tmpl.scoreRange[1]);
    var alertObj = {
      id: "A" + (state.nextAlertId++),
      cameraId: cam.id,
      type: tmpl.type,
      severity: tmpl.severity,
      score: score,
      ts: new Date(),
      acknowledged: false
    };
    state.alerts.unshift(alertObj);
    if (state.alerts.length > 60) state.alerts.pop();

    // briefly flag the camera as "alert" status, then revert after a while
    cam.status = "alert";
    cam._alertRevertAt = Date.now() + 14000;

    // record and save a short evidence clip for this event — retained on the
    // alert/case regardless of whether it's later acknowledged
    alertObj.evidence = captureEvidenceClip(cam.id, alertObj.ts);

    return alertObj;
  }

  function revertExpiredCameraAlerts(){
    var now = Date.now();
    cameras.forEach(function(c){
      if (c.status === "alert" && c._alertRevertAt && now > c._alertRevertAt){
        c.status = "online";
        delete c._alertRevertAt;
      }
    });
  }

  /* ============ SIMULATED CAMERA FEED ============ */
  /* There is no real video source in this prototype. This renders a small,
     deterministic synthetic scene per camera (per-camera seeded so each one
     looks distinct) onto a canvas, and is also used to generate the
     "recorded evidence" frames attached to each alert. It is labeled
     "SIMULATED FEED" on-screen so it's never mistaken for a live stream.
     (The one exception is the real webcam feed, which is rendered through
     its own <video> element — see renderCenterView.) */

  function hashStr(s){
    var h = 0;
    for (var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
    return h;
  }

  function mulberry32(seed){
    return function(){
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function drawFeedFrame(ctx, cam, tMs, opts){
    opts = opts || {};
    var w = ctx.canvas.width, h = ctx.canvas.height;
    ctx.clearRect(0,0,w,h);

    if (!cam){
      ctx.fillStyle = "#0B100D"; ctx.fillRect(0,0,w,h);
      ctx.fillStyle = "#6B7C71"; ctx.font = "13px 'IBM Plex Mono', monospace";
      ctx.textAlign = "center";
      ctx.fillText("SELECT A CAMERA TO VIEW ITS FEED", w/2, h/2);
      ctx.textAlign = "left";
      return;
    }

    var seed = hashStr(cam.id);
    var rand = mulberry32(seed + Math.floor(tMs/300));

    if (cam.status === "offline"){
      ctx.fillStyle = "#0B100D"; ctx.fillRect(0,0,w,h);
      for (var n=0;n<220;n++){
        ctx.fillStyle = "rgba(200,200,200,"+(rand()*0.14)+")";
        ctx.fillRect(rand()*w, rand()*h, 2, 2);
      }
      ctx.fillStyle = "#6B7C71"; ctx.textAlign = "center";
      ctx.font = "15px 'IBM Plex Mono', monospace";
      ctx.fillText("NO SIGNAL", w/2, h/2);
      ctx.font = "11px 'IBM Plex Mono', monospace";
      ctx.fillText(cam.id + " — feed lost", w/2, h/2+22);
      ctx.textAlign = "left";
      return;
    }

    var grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0, "#141B17"); grad.addColorStop(1, "#0B100D");
    ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);

    ctx.strokeStyle = "rgba(255,255,255,0.05)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, h*0.66); ctx.lineTo(w, h*0.58); ctx.stroke();

    for (var g=0; g<70; g++){
      ctx.fillStyle = "rgba(255,255,255,"+(rand()*0.03)+")";
      ctx.fillRect(rand()*w, rand()*h, 1, 1);
    }

    var objectCount = 2 + (seed % 2);
    var flagged = (opts.flagged !== undefined) ? opts.flagged : (cam.status === "alert");
    var flagIdx = Math.abs(seed) % objectCount;

    for (var o=0; o<objectCount; o++){
      var phase = (Math.abs(seed) % 1000) + o*777;
      var speed = 0.00011 + (o*0.00003);
      var driftX = ((tMs*speed + phase) % (w+120)) - 60;
      var baseY = h*0.5 + o*30 + Math.sin(tMs*0.0006 + phase)*7;
      var isVehicle = (o % 2 === 0);
      var isFlag = flagged && (o === flagIdx);

      if (isVehicle){
        ctx.fillStyle = isFlag ? "#D99A3E" : "rgba(79,168,162,0.55)";
        ctx.fillRect(driftX, baseY, 30, 13);
      } else {
        ctx.fillStyle = isFlag ? "#D99A3E" : "rgba(231,236,229,0.4)";
        ctx.beginPath(); ctx.arc(driftX+7, baseY-7, 3.6, 0, Math.PI*2); ctx.fill();
        ctx.fillRect(driftX+3, baseY-2, 9, 15);
      }
      if (isFlag){
        ctx.strokeStyle = "#D99A3E"; ctx.lineWidth = 1.2;
        ctx.strokeRect(driftX-7, baseY-18, 44, 38);
        ctx.font = "9px 'IBM Plex Mono', monospace"; ctx.fillStyle = "#D99A3E";
        ctx.fillText("FLAGGED", driftX-7, baseY-22);
      }
    }

    ctx.font = "11px 'IBM Plex Mono', monospace";
    ctx.fillStyle = "rgba(143,160,149,0.9)"; ctx.textAlign = "left";
    ctx.fillText(cam.id + " · " + cam.sector, 12, 20);

    ctx.textAlign = "right";
    var d = new Date(tMs);
    var hh=("0"+d.getHours()).slice(-2), mm=("0"+d.getMinutes()).slice(-2), ss=("0"+d.getSeconds()).slice(-2);
    ctx.fillText(hh+":"+mm+":"+ss, w-12, 20);

    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(107,124,113,0.9)"; ctx.font = "10px 'IBM Plex Mono', monospace";
    ctx.fillText("SIMULATED FEED · " + w + "×" + h, 12, h-12);

    if (flagged){
      if (Math.floor(tMs/500) % 2 === 0){
        ctx.fillStyle = "#C4573F";
        ctx.beginPath(); ctx.arc(w-18, h-16, 4, 0, Math.PI*2); ctx.fill();
      }
      ctx.textAlign = "right"; ctx.fillStyle = "rgba(196,87,63,0.95)";
      ctx.fillText("REC", w-28, h-12);
    }
    ctx.textAlign = "left";
  }

  var feedLoopHandle = null;

  function startFeedLoop(){
    stopFeedLoop();
    var canvas = byId("feedCanvas");
    var ctx = canvas.getContext("2d");
    feedLoopHandle = setInterval(function(){
      var cam = state.selectedCameraId ? cameraById(state.selectedCameraId) : null;
      drawFeedFrame(ctx, cam, Date.now());
    }, 66);
  }

  function stopFeedLoop(){
    if (feedLoopHandle){ clearInterval(feedLoopHandle); feedLoopHandle = null; }
  }

  function renderCenterView(){
    var svg = byId("mapSvg");
    var canvas = byId("feedCanvas");
    var video = byId("webcamVideo");
    var fenceBtn = byId("fenceToggle");
    var backBtn = byId("backToMapBtn");

    var selCam = state.selectedCameraId ? cameraById(state.selectedCameraId) : null;
    var showLiveWebcam = !!(selCam && selCam.type === "webcam" && webcamState.stream);

    if (state.mapView === "feed"){
      svg.style.display = "none";
      fenceBtn.style.display = "none";
      backBtn.style.display = "";

      if (showLiveWebcam){
        // Real local webcam: show the live <video> element instead of the
        // synthetic canvas feed, and don't run the simulated draw loop.
        // FIX: must explicitly set "block" — clearing to "" falls back to
        // the stylesheet's base rule (#webcamVideo{ display:none }), which
        // is what caused the video to stay hidden even though the stream
        // was correctly attached.
        canvas.style.display = "none";
        video.style.display = "block";
        stopFeedLoop();
        attachWebcamStreamToVideo();
      } else {
        // Every other camera (including the webcam entry when it's not
        // currently streaming, e.g. stopped/offline) uses the existing
        // simulated feed, which already renders a "NO SIGNAL" state.
        video.style.display = "none";
        video.srcObject = null;
        canvas.style.display = "block";
        startFeedLoop();
      }
    } else {
      svg.style.display = "";
      canvas.style.display = "none";
      video.style.display = "none";
      fenceBtn.style.display = "";
      backBtn.style.display = "none";
      stopFeedLoop();
      renderMap();
    }
  }

  /* Generates a short sequence of "recorded" frames leading up to the alert
     moment, using an offscreen canvas — this is what gets attached to the
     alert as its saved evidence, independent of whether the operator was
     viewing that camera when the alert fired. */
  function captureEvidenceClip(camId, atDate){
    var cam = cameraById(camId);
    var offscreen = document.createElement("canvas");
    offscreen.width = 320; offscreen.height = 200;
    var ctx = offscreen.getContext("2d");
    var frameCount = 5;
    var spacingMs = 350;
    var baseTs = atDate.getTime();
    var frames = [];
    for (var i=0;i<frameCount;i++){
      var t = baseTs - (frameCount-1-i)*spacingMs;
      var flagged = (i === frameCount-1);
      drawFeedFrame(ctx, cam, t, { flagged: flagged });
      frames.push(offscreen.toDataURL("image/png"));
    }
    return { frames: frames, capturedAt: atDate };
  }

  /* ============ WEBCAM (local browser device) ============ */
  /* Adds an optional extra "camera" backed by the user's own laptop/USB
     webcam via the browser's native getUserMedia API. No RTSP, no backend,
     no upload — the stream never leaves the browser tab. Permission is
     only ever requested in response to an explicit user click (never on
     page load), per the existing security posture of this prototype. */

  function getWebcamCamera(){
    return cameraById(WEBCAM_CAM_ID);
  }

  function ensureWebcamCameraEntry(status){
    var cam = getWebcamCamera();
    if (!cam){
      cam = {
        id: WEBCAM_CAM_ID,
        name: WEBCAM_CAM_NAME,
        sector: "Local Device",
        type: "webcam",
        status: status || "offline"
        // Intentionally no x/y: this isn't a fixed point on the perimeter,
        // so it's excluded from the map (see renderMap / getMappableCameras).
      };
      cameras.push(cam);
    } else {
      cam.status = status || cam.status;
    }
    return cam;
  }

  function attachWebcamStreamToVideo(){
    var video = byId("webcamVideo");
    if (video && webcamState.stream && video.srcObject !== webcamState.stream){
      video.srcObject = webcamState.stream;
    }
  }

  function detachWebcamTrackHandlers(stream){
    if (!stream) return;
    stream.getTracks().forEach(function(track){ track.onended = null; });
  }

  function handleWebcamTrackEnded(){
    // Fires if the user revokes camera permission mid-stream, unplugs a USB
    // webcam, or another application takes exclusive control of it. Handle
    // it the same way as any other lost feed rather than letting it crash.
    showToast("Laptop webcam disconnected.");
    stopWebcam();
  }

  function selectWebcamInView(){
    state.selectedCameraId = WEBCAM_CAM_ID;
    state.mapView = "feed";
    renderCameraList();
    renderCenterView();
    renderDetailStrip();
  }

  function connectWebcam(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showToast("This browser doesn't support webcam access.");
      return;
    }
    if (webcamState.stream){
      // Already running — just bring it into view rather than re-requesting.
      selectWebcamInView();
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(function(stream){
        webcamState.stream = stream;
        stream.getVideoTracks().forEach(function(track){
          track.onended = handleWebcamTrackEnded;
        });
        ensureWebcamCameraEntry("online");
        selectWebcamInView();
        renderAll();
        showToast("Laptop webcam connected.");
      })
      .catch(function(err){
        var name = err && err.name;
        var msg = "Unable to access the webcam.";
        if (name === "NotAllowedError" || name === "PermissionDeniedError"){
          msg = "Camera permission was denied.";
        } else if (name === "NotFoundError" || name === "DevicesNotFoundError"){
          msg = "No camera device was found.";
        } else if (name === "NotReadableError" || name === "TrackStartError"){
          msg = "Camera is already in use by another application.";
        } else if (name === "OverconstrainedError"){
          msg = "No camera matched the requested settings.";
        }
        // Only touch the camera record if one already exists — a failed
        // first-ever connection attempt shouldn't invent a fake camera entry.
        var cam = getWebcamCamera();
        if (cam){ cam.status = "offline"; renderAll(); }
        showToast(msg);
      });
  }

  function stopWebcam(){
    if (webcamState.stream){
      detachWebcamTrackHandlers(webcamState.stream);
      webcamState.stream.getTracks().forEach(function(track){ track.stop(); });
      webcamState.stream = null;
    }
    var video = byId("webcamVideo");
    if (video) video.srcObject = null;
    var cam = getWebcamCamera();
    if (cam) cam.status = "offline";
    renderAll();
  }

  function removeWebcamCamera(){
    stopWebcam();
    var idx = -1;
    for (var i=0;i<cameras.length;i++){ if (cameras[i].id === WEBCAM_CAM_ID){ idx = i; break; } }
    if (idx !== -1) cameras.splice(idx, 1);
    if (state.selectedCameraId === WEBCAM_CAM_ID){
      state.selectedCameraId = null;
      state.mapView = "map";
    }
    renderAll();
    showToast("Laptop webcam removed.");
  }

  /* ---- Future AI integration hook ----
     Intentionally unimplemented for now — no frame analysis happens today.
     Once a real detection pipeline exists, sample frames from #webcamVideo
     (e.g. draw to an offscreen canvas on an interval and read the pixel
     data) and pass each one through this function. */
  function processVideoFrame(frame){
    // no-op placeholder, reserved for future AI video-analysis integration
  }

  /* ============ RENDER: HEADER ============ */

  function renderHeaderStats(){
    var online = cameras.filter(function(c){ return c.status !== "offline"; }).length;
    var open = state.alerts.filter(function(a){ return !a.acknowledged; }).length;
    byId("onlineCount").textContent = online + "/" + cameras.length;
    byId("openAlertCount").textContent = open;
  }

  function tickClock(){
    byId("clock").textContent = fmtClock(new Date());
  }

  /* ============ RENDER: CAMERA LIST ============ */

  function matchesFilter(cam){
    if (state.camFilter !== "all" && cam.status !== state.camFilter) return false;
    if (state.camSearch){
      var q = state.camSearch.toLowerCase();
      if (cam.name.toLowerCase().indexOf(q) === -1 && cam.sector.toLowerCase().indexOf(q) === -1) return false;
    }
    return true;
  }

  function renderFilterCounts(){
    var counts = { all: cameras.length, online: 0, alert: 0, offline: 0 };
    cameras.forEach(function(c){ counts[c.status] = (counts[c.status] || 0) + 1; });
    byId("countAll").textContent = counts.all;
    byId("countOnline").textContent = counts.online || 0;
    byId("countAlert").textContent = counts.alert || 0;
    byId("countOffline").textContent = counts.offline || 0;
  }

  function renderCameraList(){
    var list = byId("cameraList");
    var visible = cameras.filter(matchesFilter);
    byId("camSearchClear").classList.toggle("show", !!state.camSearch);
    if (visible.length === 0){
      list.innerHTML = '<div class="cam-empty">No cameras match this filter. <button type="button" id="camEmptyReset">Clear filters</button></div>';
      var resetBtn = byId("camEmptyReset");
      if (resetBtn) resetBtn.addEventListener("click", resetCameraFilters);
      return;
    }
    var html = visible.map(function(cam){
      var sel = cam.id === state.selectedCameraId ? " selected" : "";
      return '<div class="cam-row'+sel+'" data-cam="'+cam.id+'" role="option" tabindex="0" aria-selected="'+(cam.id === state.selectedCameraId)+'" aria-label="'+cam.name+', '+cam.sector+', '+cam.status+'">'+
        '<span class="cam-dot '+cam.status+'"></span>'+
        '<div class="cam-info">'+
          '<div class="cam-name">'+cam.name+'</div>'+
          '<div class="cam-sector">'+cam.sector+'</div>'+
        '</div>'+
      '</div>';
    }).join("");
    list.innerHTML = html;
  }

  function resetCameraFilters(){
    state.camFilter = "all";
    state.camSearch = "";
    byId("camSearch").value = "";
    Array.prototype.forEach.call(byId("camFilters").querySelectorAll(".chip"), function(c){
      var isAll = c.getAttribute("data-filter") === "all";
      c.classList.toggle("active", isAll);
      c.setAttribute("aria-pressed", isAll ? "true" : "false");
    });
    renderCameraList();
  }

  /* ============ RENDER: MAP ============ */

  function getMappableCameras(){
    // The perimeter map only makes sense for fixed-position cameras. The
    // local webcam has no geographic location, so it's never invented one
    // and is simply left off the map (still fully visible in the list).
    return cameras.filter(function(c){ return typeof c.x === "number" && typeof c.y === "number"; });
  }

  function renderMap(){
    var svg = byId("mapSvg");
    var parts = [];
    var mappable = getMappableCameras();

    parts.push('<defs><linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">'+
      '<stop offset="0" stop-color="#2A352E"/><stop offset="1" stop-color="#2A352E"/></linearGradient></defs>');

    // stylized border line connecting camera x/y in sequence
    var sorted = mappable.slice().sort(function(a,b){ return a.x - b.x; });
    if (sorted.length){
      var pathD = "M " + sorted[0].x + " " + sorted[0].y;
      for (var i=1;i<sorted.length;i++){
        var prev = sorted[i-1], cur = sorted[i];
        var mx = (prev.x+cur.x)/2;
        pathD += " Q " + mx + " " + (prev.y - 20) + " " + cur.x + " " + cur.y;
      }
      if (state.fenceOn){
        parts.push('<path d="'+pathD+'" stroke="#3A4A40" stroke-width="1.6" fill="none" stroke-dasharray="4 6"/>');
      }
    }

    mappable.forEach(function(cam){
      var color = cam.status === "online" ? "#4FA8A2" : cam.status === "alert" ? "#D99A3E" : "#6B7C71";
      var selected = cam.id === state.selectedCameraId;
      parts.push('<g class="node" data-cam="'+cam.id+'" tabindex="0" role="button" aria-label="'+cam.name+', '+cam.status+'">');
      if (cam.status === "alert"){
        parts.push('<circle class="node-pulse" cx="'+cam.x+'" cy="'+cam.y+'" r="5" fill="none" stroke="'+color+'" stroke-width="1.6"/>');
      }
      if (selected){
        parts.push('<circle cx="'+cam.x+'" cy="'+cam.y+'" r="10" fill="none" stroke="'+color+'" stroke-width="1" opacity="0.5"/>');
      }
      // transparent larger hit-target so the node is easy to click/tap precisely
      parts.push('<circle cx="'+cam.x+'" cy="'+cam.y+'" r="14" fill="transparent"/>');
      parts.push('<circle cx="'+cam.x+'" cy="'+cam.y+'" r="'+(cam.status==="offline"?3.6:4.4)+'" fill="'+color+'"'+(cam.status==="offline"?' fill-opacity="0.5"':'')+'/>');
      parts.push('<text class="node-label" x="'+(cam.x+9)+'" y="'+(cam.y+3.5)+'">'+cam.id+'</text>');
      parts.push('</g>');
    });

    svg.innerHTML = parts.join("");
  }

  /* ============ RENDER: DETAIL STRIP ============ */

  function renderDetailStrip(){
    var strip = byId("detailStrip");
    var cam = state.selectedCameraId ? cameraById(state.selectedCameraId) : null;
    if (!cam){
      strip.innerHTML = '<div class="empty">Select a camera on the map or from the list to view its status.</div>';
      return;
    }
    var isWebcam = cam.type === "webcam";
    var recentAlerts = state.alerts.filter(function(a){ return a.cameraId === cam.id; }).length;
    var streamVal = isWebcam ? "Local browser device (getUserMedia)" : ("rtsp://10.4."+cam.id.slice(-2)+".11:554/live");

    var actionsHtml;
    if (isWebcam){
      var running = !!webcamState.stream;
      actionsHtml =
        '<button class="btn" data-action="webcam-start" '+(running?'disabled':'')+'>Start camera</button>'+
        '<button class="btn" data-action="webcam-stop" '+(running?'':'disabled')+'>Stop camera</button>'+
        '<button class="btn" data-action="webcam-reconnect">Reconnect camera</button>'+
        '<button class="btn" data-action="webcam-remove">Remove camera</button>';
    } else {
      actionsHtml = (cam.status === "offline"
        ? '<button class="btn" data-action="ping" data-cam="'+cam.id+'">Attempt reconnect</button>'
        : '<button class="btn" data-action="mark-offline" data-cam="'+cam.id+'">Simulate feed loss</button>');
    }

    strip.innerHTML =
      '<div class="d-field"><label>Camera</label><div class="val">'+cam.name+'</div></div>'+
      '<div class="d-field"><label>Sector</label><div class="val">'+cam.sector+'</div></div>'+
      '<div class="d-field"><label>Status</label><div class="val"><span class="pill '+cam.status+'">'+cam.status+'</span></div></div>'+
      '<div class="d-field"><label>Stream</label><div class="val mono">'+streamVal+'</div></div>'+
      '<div class="d-field"><label>Logged events</label><div class="val">'+recentAlerts+'</div></div>'+
      '<div class="d-actions">'+actionsHtml+'</div>';
  }

  /* ============ RENDER: ALERT FEED ============ */

  function renderFeedStats(){
    var open = state.alerts.filter(function(a){ return !a.acknowledged; });
    var high = open.filter(function(a){ return a.severity === "high"; }).length;
    var avg = open.length ? Math.round(open.reduce(function(s,a){ return s+a.score; },0)/open.length) : 0;
    byId("statHigh").textContent = high;
    byId("statOpen").textContent = open.length;
    byId("statAvg").textContent = avg;
  }

  function renderAlertFeed(){
    var feed = byId("alertFeed");
    if (state.alerts.length === 0){
      feed.innerHTML = '<div class="empty-feed">No alerts yet. New activity will appear here automatically.</div>';
      return;
    }
    var html = state.alerts.map(function(a){
      var cam = cameraById(a.cameraId);
      var ackClass = a.acknowledged ? " ack" : "";
      var selClass = a.id === state.selectedAlertId ? " selected" : "";
      var newClass = a.id === state.lastNewAlertId ? " is-new" : "";
      var thumb = (a.evidence && a.evidence.frames && a.evidence.frames.length)
        ? a.evidence.frames[a.evidence.frames.length-1] : null;
      return '<div class="alert-item'+ackClass+selClass+newClass+'" data-alert="'+a.id+'" tabindex="0" role="button" aria-label="'+a.type+' at '+(cam?cam.name:a.cameraId)+', severity '+a.severity+', '+(a.acknowledged?'acknowledged':'unacknowledged')+'">'+
        '<div class="alert-top">'+
          '<span class="sev-badge '+a.severity+'">'+a.severity+'</span>'+
          '<span class="alert-time">'+fmtTime(a.ts)+'</span>'+
        '</div>'+
        '<div class="alert-type">'+a.type+'</div>'+
        '<div class="alert-meta">'+(cam ? cam.name : a.cameraId)+'</div>'+
        '<div class="alert-score">'+
          '<div class="score-bar"><div class="score-fill" style="width:'+a.score+'%; background:'+scoreColor(a.score)+';"></div></div>'+
          '<div class="score-num">'+a.score+'</div>'+
        '</div>'+
        (thumb ? '<img class="alert-thumb" src="'+thumb+'" alt="Saved evidence for '+a.id+'">' : '')+
        '<div class="alert-actions">'+
          (a.acknowledged
            ? ''
            : '<button class="btn small" data-action="quick-ack" data-alert="'+a.id+'">Acknowledge</button>')+
        '</div>'+
      '</div>';
    }).join("");
    feed.innerHTML = html;
  }

  function acknowledgeAlert(alertId, opts){
    var a = state.alerts.find(function(x){ return x.id === alertId; });
    if (!a || a.acknowledged) return;
    a.acknowledged = true;
    renderAll();
    if (!opts || !opts.silent) showToast("Alert " + a.id + " acknowledged.");
  }

  /* ============ CASE VIEW ============ */

  function openCaseView(alertId){
    var alertObj = state.alerts.find(function(a){ return a.id === alertId; });
    if (!alertObj) return;
    state.selectedAlertId = alertId;
    var cam = cameraById(alertObj.cameraId);

    // "linked events": other alerts within +/- 5 min in the same or adjacent sector — simple correlation demo
    var windowMs = 5*60*1000;
    var linked = state.alerts.filter(function(a){
      if (a.id === alertObj.id) return false;
      var c2 = cameraById(a.cameraId);
      var sameSector = c2 && cam && c2.sector === cam.sector;
      var close = Math.abs(a.ts - alertObj.ts) <= windowMs;
      return sameSector && close;
    }).slice(0,4);

    clearInterval(window.__evidenceTimer);

    var panel = byId("casePanel");
    panel.style.display = "flex";
    panel.innerHTML =
      '<div class="case-head">'+
        '<button class="back-btn" id="caseBack" aria-label="Back to alert feed">&larr;</button>'+
        '<div class="case-title">Case '+alertObj.id+'</div>'+
      '</div>'+
      '<div class="case-body">'+
        '<div class="case-section">'+
          '<h4>Primary event</h4>'+
          '<div class="alert-type" style="margin-top:0;">'+alertObj.type+'</div>'+
          '<div class="alert-meta" style="margin-top:4px;">'+(cam?cam.name:alertObj.cameraId)+' &middot; '+fmtTime(alertObj.ts)+'</div>'+
          '<div class="alert-score"><div class="score-bar"><div class="score-fill" style="width:'+alertObj.score+'%; background:'+scoreColor(alertObj.score)+';"></div></div><div class="score-num">'+alertObj.score+'</div></div>'+
        '</div>'+
        '<div class="case-section">'+
          '<h4>Recorded evidence</h4>'+
          (alertObj.evidence && alertObj.evidence.frames && alertObj.evidence.frames.length
            ? '<img id="evidenceImg" class="evidence-img" src="'+alertObj.evidence.frames[0]+'" alt="Recorded evidence for '+alertObj.id+'">'+
              '<div class="alert-meta" style="margin-top:6px;">'+alertObj.evidence.frames.length+' frames saved automatically around '+fmtTime(alertObj.evidence.capturedAt)+' &middot; simulated feed, retained with this case</div>'
            : '<div class="alert-meta">No evidence was saved for this event.</div>')+
        '</div>'+
        '<div class="case-section">'+
          '<h4>Linked events'+(cam ? ' (' + cam.sector + ')' : '')+'</h4>'+
          (linked.length
            ? linked.map(function(a){
                var c2 = cameraById(a.cameraId);
                return '<div class="linked-event"><div class="linked-dot"></div><div class="linked-body">'+
                  '<div class="lt">'+a.type+'</div>'+
                  '<div class="ls">'+(c2?c2.name:a.cameraId)+' &middot; '+fmtTime(a.ts)+'</div>'+
                '</div></div>';
              }).join("")
            : '<div class="alert-meta">No correlated events in this sector within the time window.</div>')+
        '</div>'+
        '<div class="case-section">'+
          '<h4>Actions</h4>'+
          '<div style="display:flex; gap:8px;">'+
            '<button class="btn primary" id="ackBtn" '+(alertObj.acknowledged?'disabled':'')+'>'+(alertObj.acknowledged?'Acknowledged':'Acknowledge')+'</button>'+
            '<button class="btn" id="escalateBtn">Escalate to sector HQ</button>'+
          '</div>'+
        '</div>'+
      '</div>';

    byId("caseBack").addEventListener("click", closeCaseView);
    byId("ackBtn").addEventListener("click", function(){
      acknowledgeAlert(alertObj.id, { silent:true });
      openCaseView(alertId);
      showToast("Alert " + alertObj.id + " acknowledged.");
    });
    byId("escalateBtn").addEventListener("click", function(){
      showToast("Case " + alertObj.id + " escalated to sector HQ.");
    });

    if (alertObj.evidence && alertObj.evidence.frames && alertObj.evidence.frames.length > 1){
      var frames = alertObj.evidence.frames;
      var idx = 0;
      window.__evidenceTimer = setInterval(function(){
        idx = (idx + 1) % frames.length;
        var img = byId("evidenceImg");
        if (img) img.src = frames[idx];
      }, 380);
    }

    byId("caseBack").focus();
  }

  function closeCaseView(){
    clearInterval(window.__evidenceTimer);
    state.selectedAlertId = null;
    byId("casePanel").style.display = "none";
    byId("casePanel").innerHTML = "";
    renderAlertFeed();
  }

  /* ============ FULL RENDER ============ */

  function renderAll(){
    renderHeaderStats();
    renderFilterCounts();
    renderCameraList();
    renderCenterView();
    renderDetailStrip();
    renderFeedStats();
    renderAlertFeed();
  }

  /* ============ EVENTS ============ */

  byId("camSearch").addEventListener("input", function(e){
    state.camSearch = e.target.value;
    renderCameraList();
  });

  byId("camSearchClear").addEventListener("click", function(){
    state.camSearch = "";
    byId("camSearch").value = "";
    byId("camSearch").focus();
    renderCameraList();
  });

  byId("camFilters").addEventListener("click", function(e){
    var btn = e.target.closest(".chip");
    if (!btn) return;
    state.camFilter = btn.getAttribute("data-filter");
    Array.prototype.forEach.call(byId("camFilters").querySelectorAll(".chip"), function(c){
      var isActive = c === btn;
      c.classList.toggle("active", isActive);
      c.setAttribute("aria-pressed", isActive ? "true" : "false");
    });
    renderCameraList();
  });

  function selectCameraFromEl(el){
    var camId = el.getAttribute("data-cam");
    if (!camId) return;
    state.selectedCameraId = camId;
    state.mapView = "feed";
    renderCameraList();
    renderCenterView();
    renderDetailStrip();
  }

  byId("cameraList").addEventListener("click", function(e){
    var row = e.target.closest(".cam-row");
    if (!row) return;
    selectCameraFromEl(row);
  });
  byId("cameraList").addEventListener("keydown", function(e){
    var row = e.target.closest(".cam-row");
    if (!row) return;
    onActivateKey(e, function(){ selectCameraFromEl(row); });
  });

  byId("mapSvg").addEventListener("click", function(e){
    var node = e.target.closest(".node");
    if (!node) return;
    selectCameraFromEl(node);
  });
  byId("mapSvg").addEventListener("keydown", function(e){
    var node = e.target.closest(".node");
    if (!node) return;
    onActivateKey(e, function(){ selectCameraFromEl(node); });
  });

  byId("backToMapBtn").addEventListener("click", function(){
    state.mapView = "map";
    renderCenterView();
  });

  byId("fenceToggle").addEventListener("click", function(){
    state.fenceOn = !state.fenceOn;
    this.textContent = "Virtual fence: " + (state.fenceOn ? "on" : "off");
    this.classList.toggle("active", state.fenceOn);
    this.setAttribute("aria-pressed", state.fenceOn ? "true" : "false");
    renderMap();
  });

  byId("connectWebcamBtn").addEventListener("click", function(){
    connectWebcam();
  });

  byId("detailStrip").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-action]");
    if (!btn) return;
    var action = btn.getAttribute("data-action");

    if (action === "webcam-start" || action === "webcam-reconnect"){
      connectWebcam();
      return;
    }
    if (action === "webcam-stop"){
      stopWebcam();
      return;
    }
    if (action === "webcam-remove"){
      removeWebcamCamera();
      return;
    }

    var cam = cameraById(btn.getAttribute("data-cam"));
    if (!cam) return;
    if (action === "mark-offline"){
      cam.status = "offline";
      showToast(cam.id + " feed lost — camera health alert raised.");
    } else if (action === "ping"){
      cam.status = "online";
      showToast(cam.id + " reconnected.");
    }
    renderAll();
  });

  byId("alertFeed").addEventListener("click", function(e){
    var quickAck = e.target.closest("[data-action='quick-ack']");
    if (quickAck){
      e.stopPropagation();
      acknowledgeAlert(quickAck.getAttribute("data-alert"));
      return;
    }
    var item = e.target.closest(".alert-item");
    if (!item) return;
    openCaseView(item.getAttribute("data-alert"));
  });
  byId("alertFeed").addEventListener("keydown", function(e){
    var item = e.target.closest(".alert-item");
    if (!item) return;
    onActivateKey(e, function(){ openCaseView(item.getAttribute("data-alert")); });
  });

  /* ============ SIMULATED LIVE FEED ============ */

  function scheduleNextAlert(){
    var delay = randInt(5000, 11000);
    setTimeout(function(){
      revertExpiredCameraAlerts();
      var a = generateAlert();
      if (a){
        state.lastNewAlertId = a.id;
        renderAll();
        showToast("New alert: " + a.type + " — " + (cameraById(a.cameraId)||{}).name);
        setTimeout(function(){
          if (state.lastNewAlertId === a.id) state.lastNewAlertId = null;
        }, 1700);
      }
      scheduleNextAlert();
    }, delay);
  }

  function tick(){
    tickClock();
    revertExpiredCameraAlerts();
    renderHeaderStats();
    renderFilterCounts();
    if (state.mapView === "map") renderMap();
  }

  /* ============ INIT ============ */

  function init(){
    // seed a few initial alerts so the feed isn't empty on load
    for (var i=0;i<3;i++){
      var a = generateAlert();
      if (a){
        a.ts = new Date(Date.now() - randInt(20000, 240000));
        a.evidence = captureEvidenceClip(a.cameraId, a.ts);
      }
    }
    // reset camera statuses that seeding may have flagged, except keep it realistic
    cameras.forEach(function(c){ if (c.status === "alert") c.status = "online"; });

    renderAll();
    tickClock();
    setInterval(tick, 1000);
    scheduleNextAlert();
    // Note: webcam permission is never requested here — only in response to
    // an explicit "+ Connect Webcam" / "Start camera" / "Reconnect camera" click.
  }

  init();

})();
</script>
</body>
</html>
