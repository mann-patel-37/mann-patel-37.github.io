<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel Line — Operations Console (v2 demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1512; --bg-soft:#121913; --surface:#182019; --surface-2:#1C2620;
    --border:#2A352E; --border-soft:#212B24;
    --text:#E7ECE5; --text-muted:#8FA095; --text-dim:#6B7C71;
    --amber:#D99A3E; --amber-dim:rgba(217,154,62,0.16);
    --teal:#4FA8A2; --teal-dim:rgba(79,168,162,0.16);
    --red:#C4573F; --red-dim:rgba(196,87,63,0.18);
    --focus:#E7ECE5;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; font-size:14.5px; -webkit-font-smoothing:antialiased; height:100vh; overflow:hidden; }
  h1,h2,h3,h4{ font-family:'Space Grotesk',sans-serif; font-weight:600; margin:0; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  button{ font-family:inherit; cursor:pointer; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  /* Focus ring is deliberately distinct from the amber alert-pulse so keyboard
     users never confuse "this is focused" with "this is alerting". */
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  .cam-row:focus-visible, .alert-item:focus-visible, .node:focus-visible, .group-row:focus-visible{
    outline: 2px solid var(--focus); outline-offset: 2px; border-radius:2px;
    box-shadow: 0 0 0 4px rgba(231,236,229,0.15);
  }

  .hidden{ display:none !important; }
  .visually-hidden{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  .app{ display:flex; flex-direction:column; height:100vh; }

  header{ display:flex; align-items:center; justify-content:space-between; height:56px; padding:0 20px; border-bottom:1px solid var(--border-soft); flex-shrink:0; background:var(--bg-soft); gap:12px; }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-name{ font-size:15.5px; white-space:nowrap; }
  .status-strip{ display:flex; align-items:center; gap:20px; }
  .status-item{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-muted); white-space:nowrap; }
  .status-item .dot{ width:6px; height:6px; border-radius:50%; }
  .clock{ font-family:'IBM Plex Mono'; font-size:12.5px; color:var(--text-dim); min-width:150px; text-align:right; }
  .focus-btn{ background:transparent; border:1px solid var(--border); color:var(--text-muted); border-radius:4px; padding:6px 12px; font-size:12px; }
  .focus-btn:hover{ color:var(--text); border-color:var(--text-dim); }
  .focus-btn.active{ border-color:var(--teal); color:var(--teal); background:var(--teal-dim); }

  /* Layout: map is the dominant surface. Side panels shrink to rails in focus mode. */
  .body{ flex:1; display:grid; grid-template-columns: 260px 1fr 320px; min-height:0; transition:grid-template-columns .18s ease; }
  .body.focus-mode{ grid-template-columns: 0px 1fr 0px; }
  .body.focus-mode .panel.side{ opacity:0; pointer-events:none; }
  @media (max-width: 1080px){ .body{ grid-template-columns: 220px 1fr 280px; } }
  @media (max-width: 860px){
    body{ height:auto; min-height:100vh; overflow-y:auto; }
    .app{ height:auto; min-height:100vh; }
    .body{ grid-template-columns:1fr; grid-auto-rows:auto; }
    .panel{ border-right:none; border-bottom:1px solid var(--border-soft); }
    .panel-body{ max-height:280px; }
    .map-wrap{ height:340px; }
  }

  .panel{ border-right:1px solid var(--border-soft); display:flex; flex-direction:column; min-height:0; transition:opacity .15s ease; }
  .panel:last-child{ border-right:none; }
  .panel-head{ padding:14px 18px 10px; border-bottom:1px solid var(--border-soft); flex-shrink:0; display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .panel-head h2{ font-size:13px; color:var(--text-muted); font-weight:500; letter-spacing:0.02em; }
  .panel-head .sub{ font-size:11px; color:var(--text-dim); }
  .panel-body{ flex:1; overflow-y:auto; padding:8px 0; }

  /* ---------------- Camera list ---------------- */
  .search-box{ margin:10px 18px 0; position:relative; }
  .search-box input{ width:100%; background:var(--surface); border:1px solid var(--border); border-radius:3px; padding:8px 30px 8px 10px; color:var(--text); font-size:13px; font-family:inherit; }
  .search-box input:focus{ outline:none; border-color:var(--teal); }
  .search-clear{ position:absolute; right:4px; top:50%; transform:translateY(-50%); width:24px; height:24px; display:none; align-items:center; justify-content:center; background:none; border:none; color:var(--text-dim); font-size:15px; border-radius:3px; }
  .search-clear.show{ display:flex; }

  .filter-row{ display:flex; gap:6px; margin:10px 18px 0; flex-wrap:wrap; }
  .chip{ font-size:11.5px; padding:4px 9px; border-radius:12px; border:1px solid var(--border); color:var(--text-dim); background:transparent; display:inline-flex; align-items:center; gap:5px; }
  .chip .count{ font-family:'IBM Plex Mono'; font-size:10.5px; }
  .chip.active{ border-color:var(--teal); color:var(--teal); background:var(--teal-dim); }
  .chip.active .count{ color:var(--teal); }
  .filter-label{ font-size:10.5px; color:var(--text-dim); margin:10px 18px 0; }

  .cam-row{ display:flex; align-items:center; gap:10px; padding:9px 18px; cursor:pointer; border-left:2px solid transparent; }
  .cam-row:hover{ background:var(--surface); }
  .cam-row.selected{ background:var(--surface); border-left-color:var(--teal); }
  .cam-row.snoozed{ opacity:0.55; }
  .cam-info{ flex:1; min-width:0; }
  .cam-name{ font-size:13.5px; color:var(--text); }
  .cam-sector{ font-size:11px; color:var(--text-dim); }
  .cam-empty{ padding:20px 18px; color:var(--text-dim); font-size:13px; }
  .cam-empty button{ color:var(--teal); background:none; border:none; padding:0; font-size:13px; text-decoration:underline; }

  /* Status = color + shape, never color alone */
  .status-glyph{ width:12px; height:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .status-glyph svg{ display:block; }
  .snooze-tag{ font-size:9.5px; color:var(--amber); border:1px solid var(--amber); border-radius:8px; padding:1px 6px; flex-shrink:0; }

  /* ---------------- Map ---------------- */
  .map-wrap{ flex:1; position:relative; background:var(--bg); min-height:0; }
  .map-wrap svg{ width:100%; height:100%; display:block; }
  .map-legend{ position:absolute; bottom:16px; left:18px; display:flex; gap:16px; font-size:11.5px; color:var(--text-dim); flex-wrap:wrap; }
  .map-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .map-toolbar{ position:absolute; top:16px; left:18px; display:flex; gap:8px; z-index:3; }
  .tbtn{ background:var(--surface); border:1px solid var(--border); color:var(--text-muted); font-size:12px; padding:6px 12px; border-radius:3px; }
  .tbtn:hover{ border-color:var(--text-dim); color:var(--text); }
  .tbtn.active{ border-color:var(--teal); color:var(--teal); }

  @keyframes pulseRing{ 0%{ r:5; opacity:0.85; } 70%{ r:26; opacity:0; } 100%{ r:26; opacity:0; } }
  .node-pulse{ animation:pulseRing 2.4s ease-out infinite; }
  .node{ cursor:pointer; }
  .node-label{ font-family:'IBM Plex Mono'; font-size:9.5px; fill:var(--text-dim); pointer-events:none; }
  @media (prefers-reduced-motion: reduce){ .node-pulse{ animation:none; } }

  /* ---------------- Detail strip ---------------- */
  .detail-strip{ border-top:1px solid var(--border-soft); background:var(--bg-soft); padding:14px 20px; display:flex; gap:24px; align-items:center; flex-shrink:0; min-height:76px; flex-wrap:wrap; }
  .detail-strip .empty{ color:var(--text-dim); font-size:13px; }
  .d-field{ display:flex; flex-direction:column; gap:3px; }
  .d-field label{ font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; }
  .d-field .val{ font-size:13.5px; color:var(--text); }
  .pill{ font-size:11px; padding:3px 9px; border-radius:10px; display:inline-block; }
  .pill.online{ background:var(--teal-dim); color:var(--teal); }
  .pill.offline{ background:rgba(107,124,113,0.18); color:var(--text-dim); }
  .pill.alert{ background:var(--amber-dim); color:var(--amber); }
  .d-actions{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .btn{ border:1px solid var(--border); background:transparent; color:var(--text); padding:7px 14px; font-size:12.5px; border-radius:3px; }
  .btn:hover{ border-color:var(--text-dim); }
  .btn.primary{ background:var(--amber); border-color:var(--amber); color:#191309; font-weight:500; }
  .btn.primary:hover{ background:#e6ab52; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn.small{ padding:4px 9px; font-size:11px; }

  /* ---------------- Alert feed ---------------- */
  .feed-stats{ display:flex; gap:14px; padding:0 18px 10px; }
  .fstat{ flex:1; }
  .fstat b{ display:block; font-family:'Space Grotesk'; font-size:19px; }
  .fstat span{ font-size:10.5px; color:var(--text-dim); }

  .bulk-bar{ display:flex; align-items:center; justify-content:space-between; padding:0 18px 10px; gap:8px; }
  .bulk-bar .left{ font-size:11.5px; color:var(--text-dim); }

  /* Backpressure notice when alerts are queued instead of flooding in */
  .queue-note{ margin:0 18px 10px; font-size:11.5px; color:var(--amber); background:var(--amber-dim); border:1px solid var(--amber); border-radius:4px; padding:7px 10px; display:none; }
  .queue-note.show{ display:block; }

  /* Grouped alert row — a collapsed cluster of similar events */
  .group-row{ margin:0 12px 8px; border:1px solid var(--border); border-radius:5px; overflow:hidden; }
  .group-head{ display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; background:var(--surface); }
  .group-head:hover{ background:var(--surface-2); }
  .group-count{ font-family:'IBM Plex Mono'; font-size:11px; background:var(--surface-2); border-radius:10px; padding:2px 8px; color:var(--text-muted); }
  .group-title{ flex:1; font-size:13px; }
  .group-chevron{ color:var(--text-dim); font-size:11px; transition:transform .12s ease; }
  .group-row.open .group-chevron{ transform:rotate(90deg); }
  .group-children{ display:none; }
  .group-row.open .group-children{ display:block; }

  /* Severity drives visual weight, not just a badge color */
  .alert-item{ padding:12px 18px; border-bottom:1px solid var(--border-soft); cursor:pointer; transition:background .12s ease; position:relative; display:flex; gap:10px; }
  .alert-item:hover{ background:var(--surface); }
  .alert-item.selected{ background:var(--surface-2); }
  .alert-item.ack{ opacity:0.45; }
  .alert-item.is-new{ animation:newAlertFlash 1.6s ease-out; }
  @keyframes newAlertFlash{ 0%{ background:var(--teal-dim); } 100%{ background:transparent; } }
  @media (prefers-reduced-motion: reduce){ .alert-item.is-new{ animation:none; } }

  .alert-item.sev-high{ border-left:3px solid var(--red); background:linear-gradient(90deg, var(--red-dim), transparent 40%); }
  .alert-item.sev-high.ack{ background:none; }
  .alert-item.sev-med{ border-left:3px solid var(--amber); }
  .alert-item.sev-low{ border-left:3px solid var(--border); }

  .alert-check{ margin-top:2px; flex-shrink:0; }
  .alert-main{ flex:1; min-width:0; }
  .alert-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .sev-badge{ font-size:10px; padding:2px 7px; border-radius:3px; font-weight:500; letter-spacing:0.02em; }
  .sev-badge.high{ background:var(--red-dim); color:var(--red); }
  .sev-badge.med{ background:var(--amber-dim); color:var(--amber); }
  .sev-badge.low{ background:var(--teal-dim); color:var(--teal); }
  .alert-time{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-dim); }
  .alert-type{ font-size:13.5px; color:var(--text); margin-top:6px; }
  .alert-item.sev-high .alert-type{ font-size:14.5px; font-weight:600; }
  .alert-meta{ font-size:11.5px; color:var(--text-dim); margin-top:3px; }
  .alert-score{ display:flex; align-items:center; gap:6px; margin-top:8px; }
  .score-bar{ flex:1; height:3px; background:var(--border-soft); border-radius:2px; overflow:hidden; }
  .score-fill{ height:100%; border-radius:2px; }
  .score-num{ font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--text-dim); width:24px; text-align:right; }
  .alert-actions{ display:flex; justify-content:flex-end; gap:6px; margin-top:8px; }
  .empty-feed{ padding:24px 18px; color:var(--text-dim); font-size:13px; text-align:center; }

  /* ---------------- Escalate modal (replaces the old "toast and forget") ---------------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(6,9,7,0.72); z-index:40; display:flex; align-items:center; justify-content:center; padding:24px; }
  .modal-card{ width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:24px 26px; }
  .modal-card h3{ font-size:16px; margin-bottom:14px; }
  .modal-row{ display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-top:1px solid var(--border-soft); }
  .modal-row:first-of-type{ border-top:none; }
  .modal-row label{ color:var(--text-dim); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }
  .esc-confirm{ display:none; margin-top:14px; font-size:12.5px; color:var(--teal); background:var(--teal-dim); border:1px solid var(--teal); border-radius:4px; padding:8px 10px; }

  .case-panel{ position:absolute; inset:0; background:var(--bg); z-index:5; display:flex; flex-direction:column; }
  .case-head{ padding:16px 18px; border-bottom:1px solid var(--border-soft); display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .back-btn{ background:none; border:none; color:var(--text-muted); font-size:18px; padding:2px 6px; line-height:1; border-radius:3px; }
  .back-btn:hover{ color:var(--text); background:var(--surface); }
  .case-title{ font-size:14px; }
  .case-body{ flex:1; overflow-y:auto; padding:16px 18px; }
  .case-section{ margin-bottom:22px; }
  .case-section h4{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim); margin-bottom:10px; font-weight:500; }
  .evidence-img{ width:100%; display:block; border-radius:4px; border:1px solid var(--border); background:#000; }
  .linked-event{ display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--border-soft); }
  .linked-event:first-child{ border-top:none; }
  .linked-dot{ width:6px; height:6px; border-radius:50%; background:var(--teal); margin-top:6px; flex-shrink:0; }
  .linked-body .lt{ font-size:13px; color:var(--text); }
  .linked-body .ls{ font-size:11px; color:var(--text-dim); margin-top:2px; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:10px 18px; border-radius:4px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:50; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app" id="appRoot">
  <header>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2 L21 6.5 V12.5 C21 17.5 17.2 21.2 12 22.5 C6.8 21.2 3 17.5 3 12.5 V6.5 Z" stroke="#D99A3E" stroke-width="1.4"/>
        <circle cx="12" cy="12" r="2.4" fill="#4FA8A2"/>
      </svg>
      <span class="brand-name">Sentinel Line <span style="color:var(--text-dim); font-weight:400; font-size:12.5px;">— console v2</span></span>
    </div>
    <div class="status-strip">
      <div class="status-item"><span class="dot" style="background:var(--teal);" aria-hidden="true"></span><span id="onlineCount">—</span> cameras online</div>
      <div class="status-item"><span class="dot" style="background:var(--amber);" aria-hidden="true"></span><span id="openAlertCount">—</span> open alerts</div>
      <div class="clock mono" id="clock">—</div>
      <button class="focus-btn" id="focusModeBtn" type="button" aria-pressed="false">Focus map</button>
    </div>
  </header>

  <div class="body" id="bodyGrid">
    <div class="panel side" id="cameraPanel">
      <div class="panel-head"><h2>Cameras</h2></div>
      <div class="search-box">
        <label class="visually-hidden" for="camSearch">Search cameras by name or sector</label>
        <input type="text" id="camSearch" placeholder="Search by name or sector…" autocomplete="off">
        <button class="search-clear" id="camSearchClear" type="button" aria-label="Clear search">&times;</button>
      </div>
      <div class="filter-row" id="camFilters" role="group" aria-label="Filter cameras by status">
        <button class="chip active" data-filter="all" aria-pressed="true">All <span class="count" id="countAll"></span></button>
        <button class="chip" data-filter="online" aria-pressed="false">Online <span class="count" id="countOnline"></span></button>
        <button class="chip" data-filter="alert" aria-pressed="false">Alert <span class="count" id="countAlert"></span></button>
        <button class="chip" data-filter="offline" aria-pressed="false">Offline <span class="count" id="countOffline"></span></button>
      </div>
      <div class="panel-body" id="cameraList" role="listbox" aria-label="Camera list"></div>
    </div>

    <div class="panel" id="mapPanel" style="display:flex; flex-direction:column;">
      <div class="map-wrap">
        <div class="map-toolbar">
          <button class="tbtn active" data-fence="1" id="fenceToggle" aria-pressed="true">Virtual fence: on</button>
        </div>
        <svg id="mapSvg" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Perimeter map with camera positions"></svg>
        <div class="map-legend">
          <span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="#4FA8A2"/></svg>Online</span>
          <span><svg width="10" height="10"><polygon points="5,0 10,9 0,9" fill="#D99A3E"/></svg>Active alert</span>
          <span><svg width="10" height="10"><rect width="8" height="8" x="1" y="1" fill="#6B7C71" opacity="0.6"/></svg>Offline</span>
        </div>
      </div>
      <div class="detail-strip" id="detailStrip">
        <div class="empty">Select a camera on the map or from the list to view its status.</div>
      </div>
    </div>

    <div class="panel side" id="feedPanel" style="position:relative;">
      <div class="panel-head">
        <h2>Live alert feed</h2>
        <span class="sub" id="queueSub"></span>
      </div>
      <div class="feed-stats">
        <div class="fstat"><b id="statHigh">0</b><span>High severity</span></div>
        <div class="fstat"><b id="statOpen">0</b><span>Unacknowledged</span></div>
        <div class="fstat"><b id="statAvg">0</b><span>Avg. threat score</span></div>
      </div>
      <div class="filter-row" id="sevFilters" role="group" aria-label="Filter alerts by severity">
        <button class="chip active" data-sev="all" aria-pressed="true">All</button>
        <button class="chip" data-sev="high" aria-pressed="false">High</button>
        <button class="chip" data-sev="med" aria-pressed="false">Medium</button>
        <button class="chip" data-sev="low" aria-pressed="false">Low</button>
      </div>
      <div class="bulk-bar">
        <span class="left" id="bulkLabel">0 selected</span>
        <button class="btn small" id="bulkAckBtn" disabled>Acknowledge selected</button>
      </div>
      <div class="queue-note" id="queueNote"></div>
      <div class="panel-body" id="alertFeed"></div>
      <div class="case-panel" id="casePanel" style="display:none;"></div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="escalateModal" role="dialog" aria-modal="true" aria-labelledby="escTitle">
  <div class="modal-card">
    <h3 id="escTitle">Escalate to Sector HQ</h3>
    <div class="modal-row"><label>Case</label><span id="escCase" class="mono"></span></div>
    <div class="modal-row"><label>Camera</label><span id="escCam"></span></div>
    <div class="modal-row"><label>Sector</label><span id="escSector"></span></div>
    <div class="modal-row"><label>Time</label><span id="escTime" class="mono"></span></div>
    <div class="esc-confirm" id="escConfirm"></div>
    <div class="modal-actions">
      <button class="btn" id="escCancel">Cancel</button>
      <button class="btn primary" id="escSend">Send to HQ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  /* ============ DATA MODEL ============ */

  var cameras = [
    { id:"CAM-01", name:"CAM-01 — North Ridge",    sector:"Sector 04", x:120, y:360, status:"online" },
    { id:"CAM-02", name:"CAM-02 — Culvert Rd",      sector:"Sector 04", x:180, y:300, status:"online" },
    { id:"CAM-03", name:"CAM-03 — Watch Post 3",    sector:"Sector 04", x:230, y:230, status:"online" },
    { id:"CAM-04", name:"CAM-04 — Fence Line A",    sector:"Sector 04", x:290, y:170, status:"online" },
    { id:"CAM-05", name:"CAM-05 — Bridge Approach", sector:"Sector 02", x:370, y:120, status:"online" },
    { id:"CAM-06", name:"CAM-06 — Check Post 2",    sector:"Sector 02", x:450, y:95,  status:"online" },
    { id:"CAM-07", name:"CAM-07 — Border Road E",   sector:"Sector 02", x:530, y:120, status:"offline" },
    { id:"CAM-08", name:"CAM-08 — Ridge Overlook",  sector:"Sector 05", x:560, y:220, status:"online" },
    { id:"CAM-09", name:"CAM-09 — South Trail",     sector:"Sector 05", x:520, y:300, status:"online" },
    { id:"CAM-10", name:"CAM-10 — Depot Gate",      sector:"Sector 05", x:460, y:370, status:"online" }
  ];

  var alertTemplates = [
    { type:"Virtual fence crossing", severity:"high", scoreRange:[78,96] },
    { type:"Loitering near fence line", severity:"med", scoreRange:[45,65] },
    { type:"Unrecognized face match", severity:"high", scoreRange:[70,92] },
    { type:"Night-time movement, unverified", severity:"med", scoreRange:[38,58] },
    { type:"Vehicle — plate low confidence", severity:"low", scoreRange:[15,34] },
    { type:"Group movement, off-hour", severity:"med", scoreRange:[50,68] },
    { type:"Possible camera tamper", severity:"high", scoreRange:[80,99] }
  ];

  // Backpressure: when this many alerts are unacknowledged, new ones queue
  // instead of flooding the feed. This is the fix for the "alert every 5–11s
  // is unusable" problem — operators see a controlled stream, not a firehose.
  var MAX_LIVE_UNACK = 6;
  var GROUP_WINDOW_MS = 90000; // similar alerts within this window collapse into one group

  var state = {
    selectedCameraId: null,
    selectedAlertId: null,
    camFilter: "all",
    camSearch: "",
    sevFilter: "all",
    alerts: [],
    pendingQueue: [],
    nextAlertId: 1,
    lastNewAlertId: null,
    selectedAlertIds: {},
    openGroups: {},
    focusMode: false,
    escalateTarget: null
  };

  var snoozed = {}; // camId -> unsnoozeAt timestamp

  /* ============ HELPERS ============ */

  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function fmtTime(d){ return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds()); }
  function fmtClock(d){ return d.toLocaleDateString(undefined,{month:"short",day:"2-digit"}) + "  " + fmtTime(d); }
  function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
  function pick(arr){ return arr[randInt(0,arr.length-1)]; }
  function byId(id){ return document.getElementById(id); }
  function scoreColor(score){ return score >= 70 ? "var(--red)" : score >= 45 ? "var(--amber)" : "var(--teal)"; }
  function cameraById(id){ for (var i=0;i<cameras.length;i++){ if (cameras[i].id===id) return cameras[i]; } return null; }
  function isSnoozed(camId){ return snoozed[camId] && Date.now() < snoozed[camId]; }

  function showToast(msg){
    var t = byId("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  function onActivateKey(e, fn){
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar"){ e.preventDefault(); fn(); }
  }

  function statusGlyph(status){
    // Shape + color together, so status is never color-only.
    if (status === "online") return '<svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#4FA8A2"/></svg>';
    if (status === "alert") return '<svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0.5 9.5,9 0.5,9" fill="#D99A3E"/></svg>';
    return '<svg width="10" height="10" viewBox="0 0 10 10"><rect width="8" height="8" x="1" y="1" fill="#6B7C71" opacity="0.6"/></svg>';
  }

  /* ============ ALERT GENERATION with backpressure + grouping ============ */

  function unackCount(){ return state.alerts.filter(function(a){ return !a.acknowledged; }).length; }

  function generateAlertObject(){
    var onlineCams = cameras.filter(function(c){ return c.status !== "offline" && !isSnoozed(c.id); });
    if (onlineCams.length === 0) return null;
    var cam = pick(onlineCams);
    var tmpl = pick(alertTemplates);
    var score = randInt(tmpl.scoreRange[0], tmpl.scoreRange[1]);
    return {
      id: "A" + (state.nextAlertId++),
      cameraId: cam.id,
      type: tmpl.type,
      severity: tmpl.severity,
      score: score,
      ts: new Date(),
      acknowledged: false
    };
  }

  function admitAlert(a){
    var cam = cameraById(a.cameraId);
    if (cam){ cam.status = "alert"; cam._alertRevertAt = Date.now() + 14000; }
    state.alerts.unshift(a);
    if (state.alerts.length > 80) state.alerts.pop();
    state.lastNewAlertId = a.id;
    renderAll();
    showToast("New alert: " + a.type + " — " + (cam ? cam.name : a.cameraId));
    setTimeout(function(){ if (state.lastNewAlertId === a.id) state.lastNewAlertId = null; }, 1700);
  }

  function tickQueue(){
    // Queueing disabled: alerts are admitted as soon as they're generated,
    // no matter how many are already unacknowledged.
    byId("queueNote").classList.remove("show");
    byId("queueSub").textContent = "";
  }

  function revertExpiredCameraAlerts(){
    var now = Date.now();
    cameras.forEach(function(c){
      if (c.status === "alert" && c._alertRevertAt && now > c._alertRevertAt){ c.status = "online"; delete c._alertRevertAt; }
    });
  }

  function scheduleNextAlert(){
    var delay = randInt(12000, 22000); // slower cadence than the original 5–11s firehose
    setTimeout(function(){
      revertExpiredCameraAlerts();
      var a = generateAlertObject();
      if (a) admitAlert(a);
      scheduleNextAlert();
    }, delay);
  }

  /* ---- Grouping: similar alerts (same type + sector) within a time window
     collapse into one summary row so the feed doesn't repeat itself. ---- */

  function alertSector(a){ var c = cameraById(a.cameraId); return c ? c.sector : "Unknown"; }

  function buildGroups(list){
    var groups = [];
    var used = {};
    list.forEach(function(a){
      if (used[a.id]) return;
      var members = [a];
      used[a.id] = true;
      list.forEach(function(b){
        if (used[b.id] || b.id === a.id) return;
        if (b.type === a.type && alertSector(b) === alertSector(a) && Math.abs(b.ts - a.ts) <= GROUP_WINDOW_MS){
          members.push(b); used[b.id] = true;
        }
      });
      groups.push(members);
    });
    return groups;
  }

  /* ============ RENDER: HEADER ============ */

  function renderHeaderStats(){
    var online = cameras.filter(function(c){ return c.status !== "offline"; }).length;
    byId("onlineCount").textContent = online + "/" + cameras.length;
    byId("openAlertCount").textContent = unackCount();
  }

  function tickClock(){ byId("clock").textContent = fmtClock(new Date()); }

  /* ============ RENDER: CAMERA LIST ============ */

  function matchesCamFilter(cam){
    if (state.camFilter !== "all" && cam.status !== state.camFilter) return false;
    if (state.camSearch){
      var q = state.camSearch.toLowerCase();
      if (cam.name.toLowerCase().indexOf(q) === -1 && cam.sector.toLowerCase().indexOf(q) === -1) return false;
    }
    return true;
  }

  function renderFilterCounts(){
    var counts = { all: cameras.length, online:0, alert:0, offline:0 };
    cameras.forEach(function(c){ counts[c.status] = (counts[c.status]||0)+1; });
    byId("countAll").textContent = counts.all;
    byId("countOnline").textContent = counts.online||0;
    byId("countAlert").textContent = counts.alert||0;
    byId("countOffline").textContent = counts.offline||0;
  }

  function renderCameraList(){
    var list = byId("cameraList");
    var visible = cameras.filter(matchesCamFilter);
    byId("camSearchClear").classList.toggle("show", !!state.camSearch);
    if (visible.length === 0){
      list.innerHTML = '<div class="cam-empty">No cameras match this filter. <button type="button" id="camEmptyReset">Clear filters</button></div>';
      byId("camEmptyReset").addEventListener("click", resetCameraFilters);
      return;
    }
    list.innerHTML = visible.map(function(cam){
      var sel = cam.id === state.selectedCameraId ? " selected" : "";
      var snz = isSnoozed(cam.id) ? " snoozed" : "";
      return '<div class="cam-row'+sel+snz+'" data-cam="'+cam.id+'" role="option" tabindex="0" aria-selected="'+(cam.id===state.selectedCameraId)+'" aria-label="'+cam.name+', '+cam.sector+', '+cam.status+(isSnoozed(cam.id)?', snoozed':'')+'">'+
        '<span class="status-glyph">'+statusGlyph(cam.status)+'</span>'+
        '<div class="cam-info"><div class="cam-name">'+cam.name+'</div><div class="cam-sector">'+cam.sector+'</div></div>'+
        (isSnoozed(cam.id) ? '<span class="snooze-tag">snoozed</span>' : '')+
      '</div>';
    }).join("");
  }

  function resetCameraFilters(){
    state.camFilter = "all"; state.camSearch = "";
    byId("camSearch").value = "";
    Array.prototype.forEach.call(byId("camFilters").querySelectorAll(".chip"), function(c){
      var isAll = c.getAttribute("data-filter") === "all";
      c.classList.toggle("active", isAll); c.setAttribute("aria-pressed", isAll ? "true":"false");
    });
    renderCameraList();
  }

  /* ============ RENDER: MAP ============ */

  function renderMap(){
    var svg = byId("mapSvg");
    var parts = [];
    var sorted = cameras.slice().sort(function(a,b){ return a.x-b.x; });
    if (sorted.length){
      var pathD = "M " + sorted[0].x + " " + sorted[0].y;
      for (var i=1;i<sorted.length;i++){
        var prev=sorted[i-1], cur=sorted[i], mx=(prev.x+cur.x)/2;
        pathD += " Q " + mx + " " + (prev.y-20) + " " + cur.x + " " + cur.y;
      }
      if (state.fenceOn !== false) parts.push('<path d="'+pathD+'" stroke="#3A4A40" stroke-width="1.6" fill="none" stroke-dasharray="4 6"/>');
    }
    cameras.forEach(function(cam){
      var color = cam.status === "online" ? "#4FA8A2" : cam.status === "alert" ? "#D99A3E" : "#6B7C71";
      var selected = cam.id === state.selectedCameraId;
      parts.push('<g class="node" data-cam="'+cam.id+'" tabindex="0" role="button" aria-label="'+cam.name+', '+cam.status+'">');
      if (cam.status === "alert") parts.push('<circle class="node-pulse" cx="'+cam.x+'" cy="'+cam.y+'" r="5" fill="none" stroke="'+color+'" stroke-width="1.6"/>');
      if (selected) parts.push('<circle cx="'+cam.x+'" cy="'+cam.y+'" r="10" fill="none" stroke="'+color+'" stroke-width="1" opacity="0.5"/>');
      parts.push('<circle cx="'+cam.x+'" cy="'+cam.y+'" r="14" fill="transparent"/>');
      if (cam.status === "alert"){
        parts.push('<polygon points="'+cam.x+',' +(cam.y-5)+ ' '+(cam.x+5)+','+(cam.y+4)+' '+(cam.x-5)+','+(cam.y+4)+'" fill="'+color+'"/>');
      } else {
        parts.push('<circle cx="'+cam.x+'" cy="'+cam.y+'" r="'+(cam.status==="offline"?3.6:4.4)+'" fill="'+color+'"'+(cam.status==="offline"?' fill-opacity="0.5"':'')+'/>');
      }
      parts.push('<text class="node-label" x="'+(cam.x+9)+'" y="'+(cam.y+3.5)+'">'+cam.id+'</text>');
      parts.push('</g>');
    });
    svg.innerHTML = parts.join("");
  }

  /* ============ RENDER: DETAIL STRIP ============ */

  function renderDetailStrip(){
    var strip = byId("detailStrip");
    var cam = state.selectedCameraId ? cameraById(state.selectedCameraId) : null;
    if (!cam){ strip.innerHTML = '<div class="empty">Select a camera on the map or from the list to view its status.</div>'; return; }
    var recentAlerts = state.alerts.filter(function(a){ return a.cameraId === cam.id; }).length;
    var snoozeActive = isSnoozed(cam.id);
    var actionsHtml = (cam.status === "offline"
      ? '<button class="btn" data-action="ping" data-cam="'+cam.id+'">Attempt reconnect</button>'
      : '<button class="btn" data-action="mark-offline" data-cam="'+cam.id+'">Simulate feed loss</button>')+
      '<button class="btn" data-action="'+(snoozeActive?'unsnooze':'snooze')+'" data-cam="'+cam.id+'">'+(snoozeActive?'Cancel snooze':'Snooze 15 min')+'</button>';

    strip.innerHTML =
      '<div class="d-field"><label>Camera</label><div class="val">'+cam.name+'</div></div>'+
      '<div class="d-field"><label>Sector</label><div class="val">'+cam.sector+'</div></div>'+
      '<div class="d-field"><label>Status</label><div class="val"><span class="pill '+cam.status+'">'+cam.status+(snoozeActive?' · snoozed':'')+'</span></div></div>'+
      '<div class="d-field"><label>Stream</label><div class="val mono">rtsp://10.4.'+cam.id.slice(-2)+'.11:554/live</div></div>'+
      '<div class="d-field"><label>Logged events</label><div class="val">'+recentAlerts+'</div></div>'+
      '<div class="d-actions">'+actionsHtml+'</div>';
  }

  /* ============ RENDER: ALERT FEED ============ */

  function renderFeedStats(){
    var open = state.alerts.filter(function(a){ return !a.acknowledged; });
    var high = open.filter(function(a){ return a.severity === "high"; }).length;
    var avg = open.length ? Math.round(open.reduce(function(s,a){ return s+a.score; },0)/open.length) : 0;
    byId("statHigh").textContent = high;
    byId("statOpen").textContent = open.length;
    byId("statAvg").textContent = avg;
  }

  function matchesSevFilter(a){ return state.sevFilter === "all" || a.severity === state.sevFilter; }

  function alertItemHtml(a){
    var cam = cameraById(a.cameraId);
    var ackClass = a.acknowledged ? " ack" : "";
    var selClass = a.id === state.selectedAlertId ? " selected" : "";
    var newClass = a.id === state.lastNewAlertId ? " is-new" : "";
    var checked = state.selectedAlertIds[a.id] ? " checked" : "";
    return '<div class="alert-item sev-'+a.severity+ackClass+selClass+newClass+'" data-alert="'+a.id+'" tabindex="0" role="button" aria-label="'+a.type+' at '+(cam?cam.name:a.cameraId)+', severity '+a.severity+', '+(a.acknowledged?'acknowledged':'unacknowledged')+'">'+
      (a.acknowledged ? '' : '<input type="checkbox" class="alert-check" data-check-alert="'+a.id+'"'+checked+' aria-label="Select alert '+a.id+'">')+
      '<div class="alert-main">'+
        '<div class="alert-top"><span class="sev-badge '+a.severity+'">'+a.severity+'</span><span class="alert-time">'+fmtTime(a.ts)+'</span></div>'+
        '<div class="alert-type">'+a.type+'</div>'+
        '<div class="alert-meta">'+(cam?cam.name:a.cameraId)+'</div>'+
        '<div class="alert-score"><div class="score-bar"><div class="score-fill" style="width:'+a.score+'%; background:'+scoreColor(a.score)+';"></div></div><div class="score-num">'+a.score+'</div></div>'+
        '<div class="alert-actions">'+(a.acknowledged ? '' : '<button class="btn small" data-action="quick-ack" data-alert="'+a.id+'">Acknowledge</button>')+'</div>'+
      '</div>'+
    '</div>';
  }

  function renderAlertFeed(){
    var feed = byId("alertFeed");
    var visible = state.alerts.filter(matchesSevFilter);
    if (visible.length === 0){
      feed.innerHTML = '<div class="empty-feed">No alerts yet. New activity will appear here automatically.</div>';
      updateBulkBar();
      return;
    }
    var groups = buildGroups(visible);
    var html = groups.map(function(members){
      if (members.length === 1) return alertItemHtml(members[0]);
      var a = members[0];
      var cam = cameraById(a.cameraId);
      var key = a.type + "|" + alertSector(a);
      var open = !!state.openGroups[key];
      var unackInGroup = members.filter(function(m){ return !m.acknowledged; }).length;
      return '<div class="group-row'+(open?' open':'')+'" data-group="'+key+'">'+
        '<div class="group-head" tabindex="0" role="button" aria-expanded="'+open+'" data-toggle-group="'+key+'">'+
          '<span class="group-chevron">&#9656;</span>'+
          '<span class="group-title">'+members.length+' &times; '+a.type+' — '+alertSector(a)+'</span>'+
          '<span class="group-count">'+unackInGroup+' open</span>'+
        '</div>'+
        '<div class="group-children">'+members.map(alertItemHtml).join("")+'</div>'+
      '</div>';
    }).join("");
    feed.innerHTML = html;
    updateBulkBar();
  }

  function updateBulkBar(){
    var ids = Object.keys(state.selectedAlertIds).filter(function(id){ return state.selectedAlertIds[id]; });
    byId("bulkLabel").textContent = ids.length + " selected";
    byId("bulkAckBtn").disabled = ids.length === 0;
  }

  function acknowledgeAlert(alertId, opts){
    var a = state.alerts.find(function(x){ return x.id === alertId; });
    if (!a || a.acknowledged) return;
    a.acknowledged = true;
    delete state.selectedAlertIds[alertId];
    renderAll();
    if (!opts || !opts.silent) showToast("Alert " + a.id + " acknowledged.");
  }

  function acknowledgeSelected(){
    var ids = Object.keys(state.selectedAlertIds).filter(function(id){ return state.selectedAlertIds[id]; });
    ids.forEach(function(id){ var a = state.alerts.find(function(x){ return x.id===id; }); if (a) a.acknowledged = true; });
    state.selectedAlertIds = {};
    renderAll();
    if (ids.length) showToast(ids.length + " alert" + (ids.length===1?"":"s") + " acknowledged.");
  }

  /* ============ CASE VIEW ============ */

  function openCaseView(alertId){
    var a = state.alerts.find(function(x){ return x.id === alertId; });
    if (!a) return;
    state.selectedAlertId = alertId;
    var cam = cameraById(a.cameraId);
    var windowMs = 5*60*1000;
    var linked = state.alerts.filter(function(x){
      if (x.id === a.id) return false;
      var c2 = cameraById(x.cameraId);
      return c2 && cam && c2.sector === cam.sector && Math.abs(x.ts - a.ts) <= windowMs;
    }).slice(0,4);

    var panel = byId("casePanel");
    panel.style.display = "flex";
    panel.innerHTML =
      '<div class="case-head"><button class="back-btn" id="caseBack" aria-label="Back to alert feed">&larr;</button><div class="case-title">Case '+a.id+'</div></div>'+
      '<div class="case-body">'+
        '<div class="case-section"><h4>Primary event</h4>'+
          '<div class="alert-type" style="margin-top:0;">'+a.type+'</div>'+
          '<div class="alert-meta" style="margin-top:4px;">'+(cam?cam.name:a.cameraId)+' &middot; '+fmtTime(a.ts)+'</div>'+
          '<div class="alert-score"><div class="score-bar"><div class="score-fill" style="width:'+a.score+'%; background:'+scoreColor(a.score)+';"></div></div><div class="score-num">'+a.score+'</div></div>'+
        '</div>'+
        '<div class="case-section"><h4>Linked events'+(cam?' ('+cam.sector+')':'')+'</h4>'+
          (linked.length ? linked.map(function(x){
            var c2 = cameraById(x.cameraId);
            return '<div class="linked-event"><div class="linked-dot"></div><div class="linked-body"><div class="lt">'+x.type+'</div><div class="ls">'+(c2?c2.name:x.cameraId)+' &middot; '+fmtTime(x.ts)+'</div></div></div>';
          }).join("") : '<div class="alert-meta">No correlated events in this sector within the time window.</div>')+
        '</div>'+
        '<div class="case-section"><h4>Actions</h4>'+
          '<div style="display:flex; gap:8px;">'+
            '<button class="btn primary" id="ackBtn" '+(a.acknowledged?'disabled':'')+'>'+(a.acknowledged?'Acknowledged':'Acknowledge')+'</button>'+
            '<button class="btn" id="escalateBtn">Escalate to sector HQ</button>'+
          '</div>'+
        '</div>'+
      '</div>';

    byId("caseBack").addEventListener("click", closeCaseView);
    byId("ackBtn").addEventListener("click", function(){ acknowledgeAlert(a.id, {silent:true}); openCaseView(alertId); showToast("Alert "+a.id+" acknowledged."); });
    byId("escalateBtn").addEventListener("click", function(){ openEscalateModal(a); });
    byId("caseBack").focus();
  }

  function closeCaseView(){
    state.selectedAlertId = null;
    byId("casePanel").style.display = "none";
    byId("casePanel").innerHTML = "";
    renderAlertFeed();
  }

  /* ============ ESCALATE MODAL ============ */

  function openEscalateModal(a){
    var cam = cameraById(a.cameraId);
    state.escalateTarget = a;
    byId("escCase").textContent = a.id;
    byId("escCam").textContent = cam ? cam.name : a.cameraId;
    byId("escSector").textContent = cam ? cam.sector : "—";
    byId("escTime").textContent = fmtTime(a.ts);
    byId("escConfirm").style.display = "none";
    byId("escSend").disabled = false;
    byId("escalateModal").classList.remove("hidden");
    byId("escSend").focus();
  }
  function closeEscalateModal(){ byId("escalateModal").classList.add("hidden"); state.escalateTarget = null; }

  byId("escCancel").addEventListener("click", closeEscalateModal);
  byId("escalateModal").addEventListener("click", function(e){ if (e.target === byId("escalateModal")) closeEscalateModal(); });
  byId("escSend").addEventListener("click", function(){
    var a = state.escalateTarget;
    if (!a) return;
    byId("escSend").disabled = true;
    byId("escConfirm").style.display = "block";
    byId("escConfirm").textContent = "Sent to Sector HQ at " + fmtTime(new Date()) + ". Case " + a.id + " is now flagged for follow-up.";
    setTimeout(closeEscalateModal, 1400);
  });

  /* ============ FULL RENDER ============ */

  function renderAll(){
    renderHeaderStats();
    renderFilterCounts();
    renderCameraList();
    renderMap();
    renderDetailStrip();
    renderFeedStats();
    renderAlertFeed();
  }

  /* ============ EVENTS ============ */

  byId("camSearch").addEventListener("input", function(e){ state.camSearch = e.target.value; renderCameraList(); });
  byId("camSearchClear").addEventListener("click", function(){ state.camSearch=""; byId("camSearch").value=""; byId("camSearch").focus(); renderCameraList(); });

  byId("camFilters").addEventListener("click", function(e){
    var btn = e.target.closest(".chip"); if (!btn) return;
    state.camFilter = btn.getAttribute("data-filter");
    Array.prototype.forEach.call(byId("camFilters").querySelectorAll(".chip"), function(c){
      var a = c===btn; c.classList.toggle("active", a); c.setAttribute("aria-pressed", a?"true":"false");
    });
    renderCameraList();
  });

  byId("sevFilters").addEventListener("click", function(e){
    var btn = e.target.closest(".chip"); if (!btn) return;
    state.sevFilter = btn.getAttribute("data-sev");
    Array.prototype.forEach.call(byId("sevFilters").querySelectorAll(".chip"), function(c){
      var a = c===btn; c.classList.toggle("active", a); c.setAttribute("aria-pressed", a?"true":"false");
    });
    renderAlertFeed();
  });

  function selectCameraFromEl(el){
    var camId = el.getAttribute("data-cam"); if (!camId) return;
    state.selectedCameraId = camId;
    renderCameraList(); renderMap(); renderDetailStrip();
  }
  byId("cameraList").addEventListener("click", function(e){ var row=e.target.closest(".cam-row"); if (row) selectCameraFromEl(row); });
  byId("cameraList").addEventListener("keydown", function(e){ var row=e.target.closest(".cam-row"); if (row) onActivateKey(e, function(){ selectCameraFromEl(row); }); });
  byId("mapSvg").addEventListener("click", function(e){ var node=e.target.closest(".node"); if (node) selectCameraFromEl(node); });
  byId("mapSvg").addEventListener("keydown", function(e){ var node=e.target.closest(".node"); if (node) onActivateKey(e, function(){ selectCameraFromEl(node); }); });

  byId("fenceToggle").addEventListener("click", function(){
    state.fenceOn = state.fenceOn === false ? true : false;
    this.textContent = "Virtual fence: " + (state.fenceOn === false ? "off" : "on");
    this.classList.toggle("active", state.fenceOn !== false);
    this.setAttribute("aria-pressed", state.fenceOn !== false ? "true":"false");
    renderMap();
  });

  byId("focusModeBtn").addEventListener("click", function(){
    state.focusMode = !state.focusMode;
    byId("bodyGrid").classList.toggle("focus-mode", state.focusMode);
    this.classList.toggle("active", state.focusMode);
    this.setAttribute("aria-pressed", state.focusMode ? "true":"false");
    this.textContent = state.focusMode ? "Exit focus" : "Focus map";
  });

  byId("detailStrip").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-action]"); if (!btn) return;
    var action = btn.getAttribute("data-action");
    var cam = cameraById(btn.getAttribute("data-cam"));
    if (!cam) return;
    if (action === "mark-offline"){ cam.status="offline"; showToast(cam.id+" feed lost — camera health alert raised."); }
    else if (action === "ping"){ cam.status="online"; showToast(cam.id+" reconnected."); }
    else if (action === "snooze"){ snoozed[cam.id] = Date.now() + 15*60*1000; showToast(cam.id+" snoozed for 15 minutes."); }
    else if (action === "unsnooze"){ delete snoozed[cam.id]; showToast(cam.id+" snooze cancelled."); }
    renderAll();
  });

  byId("alertFeed").addEventListener("click", function(e){
    var toggle = e.target.closest("[data-toggle-group]");
    if (toggle){ var k=toggle.getAttribute("data-toggle-group"); state.openGroups[k] = !state.openGroups[k]; renderAlertFeed(); return; }
    var check = e.target.closest("[data-check-alert]");
    if (check){ state.selectedAlertIds[check.getAttribute("data-check-alert")] = check.checked; updateBulkBar(); return; }
    var quickAck = e.target.closest("[data-action='quick-ack']");
    if (quickAck){ e.stopPropagation(); acknowledgeAlert(quickAck.getAttribute("data-alert")); return; }
    var item = e.target.closest(".alert-item");
    if (item) openCaseView(item.getAttribute("data-alert"));
  });
  byId("alertFeed").addEventListener("keydown", function(e){
    var toggle = e.target.closest("[data-toggle-group]");
    if (toggle){ onActivateKey(e, function(){ var k=toggle.getAttribute("data-toggle-group"); state.openGroups[k]=!state.openGroups[k]; renderAlertFeed(); }); return; }
    var item = e.target.closest(".alert-item");
    if (item) onActivateKey(e, function(){ openCaseView(item.getAttribute("data-alert")); });
  });

  byId("bulkAckBtn").addEventListener("click", acknowledgeSelected);

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && !byId("escalateModal").classList.contains("hidden")) closeEscalateModal();
  });

  /* ============ CLOCK / TICK ============ */

  function tick(){
    tickClock();
    revertExpiredCameraAlerts();
    tickQueue();
    renderHeaderStats();
    renderFilterCounts();
    renderMap();
  }

  /* ============ INIT ============ */

  function init(){
    for (var i=0;i<3;i++){
      var a = generateAlertObject();
      if (a){ a.ts = new Date(Date.now() - randInt(20000, 240000)); admitAlertSilently(a); }
    }
    cameras.forEach(function(c){ if (c.status === "alert") c.status = "online"; delete c._alertRevertAt; });
    renderAll();
    tickClock();
    setInterval(tick, 1000);
    scheduleNextAlert();
  }

  function admitAlertSilently(a){
    state.alerts.unshift(a);
  }

  init();
})();
</script>
</body>
</html>
